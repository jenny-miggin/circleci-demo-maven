version: 2.1

# Maven Build Cache Extension benchmark, two workflows:
#   save-restore                  - extension's local cache dir persisted with save_cache/restore_cache
#   save-restore-plus-tool-cache  - the same, plus the build wrapped in with_tool_cache (tool: gradle)
# Dependencies (~/.m2/repository) are cached identically in both.
# "large" adds a deterministic 20 MB incompressible resource to each module (~320 MB of build cache).

executors:
  jdk:
    docker:
      - image: cimg/openjdk:21.0
    resource_class: medium
    working_directory: ~/project

commands:
  generate-blobs:
    parameters:
      blob_mb:
        type: integer
    steps:
      - when:
          condition: << parameters.blob_mb >>
          steps:
            - run:
                name: Generate << parameters.blob_mb >> MB incompressible resource per module
                working_directory: ~/project/bench
                command: |
                  for d in mod*/; do
                    m=${d%/}
                    mkdir -p "$m/src/main/resources"
                    head -c << parameters.blob_mb >>M /dev/zero \
                      | openssl enc -aes-128-ctr -nosalt -K 000102030405060708090a0b0c0d0e0f -iv "$(printf '%032x' "$((10#${m#mod}))")" \
                      > "$m/src/main/resources/blob.bin"
                  done
                  md5sum mod00/src/main/resources/blob.bin

  restore-deps:
    steps:
      - restore_cache:
          name: Restore Maven dependencies
          keys:
            - m2-deps-v1-{{ checksum "bench/pom.xml" }}
  save-deps:
    steps:
      - save_cache:
          name: Save Maven dependencies
          key: m2-deps-v1-{{ checksum "bench/pom.xml" }}
          paths:
            - ~/.m2/repository
  build:
    parameters:
      extra:
        type: string
        default: ""
    steps:
      - run:
          name: mvn verify
          working_directory: ~/project/bench
          command: |
            mvn -B -ntp verify -Dmaven.build.cache.location="$HOME/build-cache" << parameters.extra >> 2>&1 | tee /tmp/mvn.log
            test "${PIPESTATUS[0]}" -eq 0
      - run:
          name: Cache summary
          when: always
          command: |
            echo "modules restored from cache: $(grep -c 'Found cached build' /tmp/mvn.log || true) of 16"
            grep -E 'Total time|BUILD' /tmp/mvn.log
            du -sh "$HOME/build-cache" 2>/dev/null || true

jobs:
  save-restore-cache:
    executor: jdk
    parameters:
      blob_mb:
        type: integer
        default: 0
      cache_prefix:
        type: string
      tool_cache:
        type: boolean
        default: false
    steps:
      - checkout
      - generate-blobs:
          blob_mb: << parameters.blob_mb >>
      - restore-deps
      - restore_cache:
          name: Restore build cache
          keys:
            - << parameters.cache_prefix >>-{{ .Branch }}-{{ .Revision }}
            - << parameters.cache_prefix >>-{{ .Branch }}-
            - << parameters.cache_prefix >>-
      - unless:
          condition: << parameters.tool_cache >>
          steps:
            - build
      - when:
          condition: << parameters.tool_cache >>
          steps:
            - with_tool_cache:
                tool: gradle
                steps:
                  - build
      - save_cache:
          name: Save build cache
          key: << parameters.cache_prefix >>-{{ .Branch }}-{{ .Revision }}
          paths:
            - ~/build-cache
      - save-deps

workflows:
  save-restore:
    jobs:
      - save-restore-cache:
          name: save-restore-small
          cache_prefix: mvn-build-cache-v1
      - save-restore-cache:
          name: save-restore-large
          blob_mb: 20
          cache_prefix: mvn-build-cache-v1-blob20
  save-restore-plus-tool-cache:
    jobs:
      - save-restore-cache:
          name: save-restore-plus-tool-cache-small
          cache_prefix: mvn-build-cache-v2-tc
          tool_cache: true
      - save-restore-cache:
          name: save-restore-plus-tool-cache-large
          blob_mb: 20
          cache_prefix: mvn-build-cache-v2-tc-blob20
          tool_cache: true

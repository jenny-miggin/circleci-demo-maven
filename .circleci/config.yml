version: 2.1

# Maven Build Cache Extension benchmark: the same build, three ways.
#   no-build-cache      - plain mvn verify
#   save-restore-cache  - extension's local cache dir persisted with save_cache/restore_cache
#   with-tool-cache     - extension's remote cache pointed at the with_tool_cache (tool: gradle) server
# Dependencies (~/.m2/repository) are cached identically in all three so only the build cache differs.

executors:
  jdk:
    docker:
      - image: cimg/openjdk:21.0
    resource_class: medium
    working_directory: ~/project

commands:
  https-checkout:
    steps:
      - run:
          name: Checkout over HTTPS
          command: |
            git clone --depth 1 --branch "$CIRCLE_BRANCH" "https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git" .
            git log --oneline -1
  restore-deps:
    steps:
      - restore_cache:
          name: Restore Maven dependencies
          keys:
            - m2-deps-v1-{{ checksum "bench/pom.xml" }}
  save-deps:
    steps:
      - save_cache:
          name: Save Maven dependencies
          key: m2-deps-v1-{{ checksum "bench/pom.xml" }}
          paths:
            - ~/.m2/repository
  build:
    parameters:
      extra:
        type: string
        default: ""
    steps:
      - run:
          name: mvn verify
          working_directory: ~/project/bench
          command: |
            mvn -B -ntp verify -Dmaven.build.cache.location="$HOME/build-cache" << parameters.extra >> 2>&1 | tee /tmp/mvn.log
            test "${PIPESTATUS[0]}" -eq 0
      - run:
          name: Cache summary
          when: always
          command: |
            echo "modules restored from cache: $(grep -c 'Found cached build' /tmp/mvn.log || true) of 16"
            grep -E 'Total time|BUILD' /tmp/mvn.log
            du -sh "$HOME/build-cache" 2>/dev/null || true

jobs:
  probe:
    executor: jdk
    steps:
      - https-checkout
      - with_tool_cache:
          tool: gradle
          steps:
            - run:
                name: Probe cache server paths
                command: |
                  cat ~/.gradle/init.d/circleci.gradle.kts
                  BASE=$(jq -r .url /tmp/circleci-cache-subcommand.json)/v1/cache
                  head -c 4096 /dev/urandom > /tmp/blob
                  for p in "0123456789abcdef0123456789abcdef" "v1.1/com.example.bench/probe/abc123/buildinfo.xml" "v1.1/com.example.bench/probe/abc123/probe.jar"; do
                    echo "--- $BASE/$p"
                    curl -s -o /dev/null -w 'PUT %{http_code}\n' -X PUT --data-binary @/tmp/blob "$BASE/$p"
                    curl -s -o /tmp/got -w 'GET %{http_code}\n' "$BASE/$p"
                    cmp -s /tmp/blob /tmp/got && echo "roundtrip OK" || echo "roundtrip MISMATCH"
                  done
                  curl -s -o /dev/null -w 'GET missing %{http_code}\n' "$BASE/v1.1/does/not/exist.xml"
                  BIN=$(ls /tmp/task-agent-subcommands/task-agent-subcommands/cache/*/linux/*/cache | head -1)
                  "$BIN" --help 2>&1 | head -30 || true
                  "$BIN" server start --help 2>&1 | head -30 || true

  no-build-cache:
    executor: jdk
    steps:
      - https-checkout
      - restore-deps
      - build:
          extra: -Dmaven.build.cache.enabled=false
      - save-deps

  save-restore-cache:
    executor: jdk
    steps:
      - https-checkout
      - restore-deps
      - restore_cache:
          name: Restore build cache
          keys:
            - mvn-build-cache-v1-{{ .Branch }}-{{ .Revision }}
            - mvn-build-cache-v1-{{ .Branch }}-
            - mvn-build-cache-v1-
      - build
      - save_cache:
          name: Save build cache
          key: mvn-build-cache-v1-{{ .Branch }}-{{ .Revision }}
          paths:
            - ~/build-cache
      - save-deps

  with-tool-cache:
    executor: jdk
    steps:
      - https-checkout
      - restore-deps
      - with_tool_cache:
          tool: gradle
          steps:
            - run:
                name: Point Maven at the tool cache server
                command: |
                  echo "export MVN_REMOTE_URL=$(jq -r .url /tmp/circleci-cache-subcommand.json)/v1/cache" >> "$BASH_ENV"
            - build:
                extra: >-
                  -Dmaven.build.cache.remote.enabled=true
                  -Dmaven.build.cache.remote.save.enabled=true
                  -Dmaven.build.cache.remote.url="$MVN_REMOTE_URL"
      - save-deps

workflows:
  bench:
    jobs:
      - probe
      - no-build-cache
      - save-restore-cache
      - with-tool-cache

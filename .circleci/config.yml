version: 2.1

# Maven Build Cache Extension benchmark: the same build, three ways.
#   no-build-cache      - plain mvn verify
#   save-restore-cache  - extension's local cache dir persisted with save_cache/restore_cache
#   with-tool-cache     - extension's remote cache pointed at the with_tool_cache (tool: gradle) server
# Dependencies (~/.m2/repository) are cached identically in all three so only the build cache differs.
# "large" adds a deterministic 20 MB incompressible resource to each module (~320 MB of build cache).

executors:
  jdk:
    docker:
      - image: cimg/openjdk:21.0
    resource_class: medium
    working_directory: ~/project

commands:
  generate-blobs:
    parameters:
      blob_mb:
        type: integer
    steps:
      - when:
          condition: << parameters.blob_mb >>
          steps:
            - run:
                name: Generate << parameters.blob_mb >> MB incompressible resource per module
                working_directory: ~/project/bench
                command: |
                  for d in mod*/; do
                    m=${d%/}
                    mkdir -p "$m/src/main/resources"
                    head -c << parameters.blob_mb >>M /dev/zero \
                      | openssl enc -aes-128-ctr -nosalt -K 000102030405060708090a0b0c0d0e0f -iv "$(printf '%032x' "$((10#${m#mod}))")" \
                      > "$m/src/main/resources/blob.bin"
                  done
                  md5sum mod00/src/main/resources/blob.bin

  https-checkout:
    steps:
      - run:
          name: Checkout over HTTPS
          command: |
            git clone --depth 1 --branch "$CIRCLE_BRANCH" "https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git" .
            git log --oneline -1
  restore-deps:
    steps:
      - restore_cache:
          name: Restore Maven dependencies
          keys:
            - m2-deps-v1-{{ checksum "bench/pom.xml" }}
  save-deps:
    steps:
      - save_cache:
          name: Save Maven dependencies
          key: m2-deps-v1-{{ checksum "bench/pom.xml" }}
          paths:
            - ~/.m2/repository
  build:
    parameters:
      extra:
        type: string
        default: ""
    steps:
      - run:
          name: mvn verify
          working_directory: ~/project/bench
          command: |
            mvn -B -ntp verify -Dmaven.build.cache.location="$HOME/build-cache" << parameters.extra >> 2>&1 | tee /tmp/mvn.log
            test "${PIPESTATUS[0]}" -eq 0
      - run:
          name: Cache summary
          when: always
          command: |
            echo "modules restored from cache: $(grep -c 'Found cached build' /tmp/mvn.log || true) of 16"
            grep -E 'Total time|BUILD' /tmp/mvn.log
            du -sh "$HOME/build-cache" 2>/dev/null || true

jobs:
  no-build-cache:
    executor: jdk
    parameters:
      blob_mb:
        type: integer
        default: 0
    steps:
      - https-checkout
      - generate-blobs:
          blob_mb: << parameters.blob_mb >>
      - restore-deps
      - build:
          extra: -Dmaven.build.cache.enabled=false
      - save-deps

  save-restore-cache:
    executor: jdk
    parameters:
      blob_mb:
        type: integer
        default: 0
      cache_prefix:
        type: string
        default: mvn-build-cache-v1
    steps:
      - https-checkout
      - generate-blobs:
          blob_mb: << parameters.blob_mb >>
      - restore-deps
      - restore_cache:
          name: Restore build cache
          keys:
            - << parameters.cache_prefix >>-{{ .Branch }}-{{ .Revision }}
            - << parameters.cache_prefix >>-{{ .Branch }}-
            - << parameters.cache_prefix >>-
      - build
      - save_cache:
          name: Save build cache
          key: << parameters.cache_prefix >>-{{ .Branch }}-{{ .Revision }}
          paths:
            - ~/build-cache
      - save-deps

  with-tool-cache:
    executor: jdk
    parameters:
      blob_mb:
        type: integer
        default: 0
    steps:
      - https-checkout
      - generate-blobs:
          blob_mb: << parameters.blob_mb >>
      - restore-deps
      - with_tool_cache:
          tool: gradle
          steps:
            - run:
                name: Point Maven at the tool cache server
                command: |
                  echo "export MVN_REMOTE_URL=$(jq -r .url /tmp/circleci-cache-subcommand.json)/v1/cache" >> "$BASH_ENV"
            - build:
                extra: >-
                  -Dmaven.build.cache.remote.enabled=true
                  -Dmaven.build.cache.remote.save.enabled=true
                  -Dmaven.build.cache.remote.url="$MVN_REMOTE_URL"
      - save-deps

workflows:
  bench:
    jobs:
      - no-build-cache:
          name: no-build-cache-small
      - save-restore-cache:
          name: save-restore-cache-small
      - with-tool-cache:
          name: with-tool-cache-small
      - no-build-cache:
          name: no-build-cache-large
          blob_mb: 20
      - save-restore-cache:
          name: save-restore-cache-large
          blob_mb: 20
          cache_prefix: mvn-build-cache-v1-blob20
      - with-tool-cache:
          name: with-tool-cache-large
          blob_mb: 20
